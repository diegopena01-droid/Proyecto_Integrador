version: '3'

services:
  myDB:
    image: postgres:15.3
    container_name: checkevent-db
    restart: always
    ports:
      - 5433:5432
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=checkevent_db
    volumes:
      - ./postgres:/var/lib/postgresql/data
      - ./src/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./src/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  pdAdmin:
    image: dpage/pgadmin4
    container_name: checkevent-pgadmin
    restart: always
    depends_on:
      - myDB
    ports:
      - 8080:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=user@google.com
      - PGADMIN_DEFAULT_PASSWORD=123456
    volumes:
      - ./pgadmin:/var/lib/pgadmin