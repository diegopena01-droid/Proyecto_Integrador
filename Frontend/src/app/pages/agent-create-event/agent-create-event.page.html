<div class="container py-5">

  <div class="mb-4 d-flex justify-content-between align-items-start">
    <div>
      <h1 class="fw-bold">Registrar evento</h1>
      <p class="text-muted mb-0">Completa todos los datos del evento o espectáculo.</p>
    </div>
    <a routerLink="/agent/events" class="btn btn-outline-primary">
      <i class="bi bi-arrow-left me-2"></i>
      Volver
    </a>
  </div>

  @if (error) {
    <div class="alert alert-danger">{{ error }}</div>
  }
  @if (mensaje) {
    <div class="alert alert-success">{{ mensaje }}</div>
  }

  <div class="card shadow-sm border-0">
    <div class="card-body p-4">

      <form (ngSubmit)="onSubmit()">
        <div class="row g-3">

          <div class="col-md-6">
            <label for="codigo" class="form-label">Código único del evento</label>
            <input
              type="text"
              id="codigo"
              class="form-control"
              placeholder="Ej: EV010"
              [(ngModel)]="codigo"
              name="codigo"
              required
            >
          </div>

          <div class="col-md-6">
            <label for="nombre" class="form-label">Nombre del evento</label>
            <input
              type="text"
              id="nombre"
              class="form-control"
              placeholder="Nombre del evento"
              [(ngModel)]="nombre"
              name="nombre"
              required
            >
          </div>

          <div class="col-12">
            <label for="descripcion" class="form-label">Descripción</label>
            <textarea
              id="descripcion"
              class="form-control"
              rows="3"
              placeholder="Descripción del evento"
              [(ngModel)]="descripcion"
              name="descripcion"
            ></textarea>
          </div>

          <div class="col-md-6">
            <label for="fechaInicio" class="form-label">Fecha de inicio</label>
            <input
              type="date"
              id="fechaInicio"
              class="form-control"
              [(ngModel)]="fechaInicio"
              name="fechaInicio"
              required
            >
          </div>

          <div class="col-md-3">
            <label for="horaInicio" class="form-label">Hora inicio</label>
            <input
              type="time"
              id="horaInicio"
              class="form-control"
              [(ngModel)]="horaInicio"
              name="horaInicio"
              required
            >
          </div>

          <div class="col-md-3">
            <label for="horaFin" class="form-label">Hora fin</label>
            <input
              type="time"
              id="horaFin"
              class="form-control"
              [(ngModel)]="horaFin"
              name="horaFin"
            >
          </div>

          <div class="col-md-4">
            <label for="capacidad" class="form-label">Capacidad</label>
            <input
              type="number"
              id="capacidad"
              class="form-control"
              min="1"
              [(ngModel)]="capacidad"
              name="capacidad"
              required
            >
          </div>

          <div class="col-md-4">
            <label for="precio" class="form-label">Precio (COP)</label>
            <input
              type="number"
              id="precio"
              class="form-control"
              min="0"
              [(ngModel)]="precio"
              name="precio"
              required
            >
          </div>

          <div class="col-md-4">
            <label for="estado" class="form-label">Estado</label>
            <select
              id="estado"
              class="form-select"
              [(ngModel)]="estado"
              name="estado">
              @for (e of estados; track e) {
                <option [value]="e">{{ e }}</option>
              }
            </select>
          </div>

          <div class="col-12">
            <label for="imagenUrl" class="form-label">URL de imagen (opcional)</label>
            <input
              type="url"
              id="imagenUrl"
              class="form-control"
              placeholder="https://..."
              [(ngModel)]="imagenUrl"
              name="imagenUrl"
            >
          </div>

          <div class="col-12 d-flex gap-2 mt-3">
            <button
              type="submit"
              class="btn btn-primary"
              [disabled]="enviando">
              <i class="bi bi-plus-circle me-2"></i>
              {{ enviando ? 'Guardando...' : 'Crear evento' }}
            </button>
            <a routerLink="/agent/events" class="btn btn-outline-secondary">
              Cancelar
            </a>
          </div>

        </div>
      </form>

    </div>
  </div>

</div>
