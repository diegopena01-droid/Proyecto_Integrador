<nav class="navbar navbar-expand-lg bg-primary navbar-dark">
  <div class="container">

    <a class="navbar-brand" [routerLink]="homeLink">
      <img
        src="images/calendario.png"
        alt="Logo de CheckEvent"
        class="brand-logo"
      >
      <span class="brand-text">CheckEvent</span>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarPrincipal"
      aria-controls="navbarPrincipal"
      aria-expanded="false"
      aria-label="Mostrar navegación">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarPrincipal">

      <ul class="navbar-nav ms-auto align-items-lg-center">

        <!-- Menú CLIENTE -->
        @if (rol === 'cliente') {
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/client/events"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }">
              <i class="bi bi-calendar-event me-1"></i>
              Eventos
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/client/reservations"
              routerLinkActive="active">
              <i class="bi bi-ticket-perforated me-1"></i>
              Mis Reservas
            </a>
          </li>
        }

        <!-- Menú AGENTE -->
        @if (rol === 'agente') {
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/agent/events"
              routerLinkActive="active">
              <i class="bi bi-calendar-event me-1"></i>
              Eventos
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/agent/create-event"
              routerLinkActive="active">
              <i class="bi bi-plus-circle me-1"></i>
              Crear evento
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/agent/reservations"
              routerLinkActive="active">
              <i class="bi bi-ticket-perforated me-1"></i>
              Reservas
            </a>
          </li>
        }

        <!-- Menú ADMIN -->
        @if (rol === 'admin') {
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/admin"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }">
              <i class="bi bi-speedometer2 me-1"></i>
              Panel
            </a>
          </li>
        }

        <!-- Nombre y rol (solo si hay sesión) -->
        @if (estaLogueado) {
          <li class="nav-item">
            <span class="nav-link user-info">
              <i class="bi bi-person-circle me-1"></i>
              {{ nombre }}
            </span>
          </li>

          <li class="nav-item">
            <span class="nav-link user-role">
              {{ rolTexto }}
            </span>
          </li>

          <li class="nav-item ms-lg-2">
            <a
              class="nav-link logout-link"
              href="#"
              (click)="logout(); $event.preventDefault()">
              <i class="bi bi-box-arrow-right me-1"></i>
              Cerrar sesión
            </a>
          </li>
        }

      </ul>
    </div>
  </div>
</nav>
