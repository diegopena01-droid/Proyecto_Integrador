<div class="container py-5">

  <div class="text-center mb-5">
    <h1 class="fw-bold">Panel del Agente</h1>

    <p class="text-muted">
      Gestión de eventos y reservas
    </p>
  </div>

  <div class="row g-4">

    <!-- Eventos -->
    <div class="col-md-6">

      <div class="card h-100 shadow-sm">

        <div class="card-body text-center p-4">

          <i class="bi bi-calendar-event fs-1 text-primary"></i>

          <h3 class="mt-3">
            Eventos
          </h3>

          <p class="text-muted">
            Visualiza todos los eventos registrados en el sistema.
          </p>

          <a
            routerLink="/agent/events"
            class="btn btn-primary"
          >
            Ver eventos
          </a>

        </div>

      </div>

    </div>

    <!-- Registrar evento -->
    <div class="col-md-6">

      <div class="card h-100 shadow-sm">

        <div class="card-body text-center p-4">

          <i class="bi bi-calendar-plus fs-1 text-success"></i>

          <h3 class="mt-3">
            Registrar evento
          </h3>

          <p class="text-muted">
            Registra un nuevo evento o espectáculo.
          </p>

          <a
            routerLink="/agent/create-event"
            class="btn btn-success"
          >
            Registrar evento
          </a>

        </div>

      </div>

    </div>

    <!-- Reservas -->
    <div class="col-md-6">

      <div class="card h-100 shadow-sm">

        <div class="card-body text-center p-4">

          <i class="bi bi-ticket-perforated fs-1 text-warning"></i>

          <h3 class="mt-3">
            Reservas
          </h3>

          <p class="text-muted">
            Consulta las reservas solicitadas y administra su estado.
          </p>

          <a
            routerLink="/agent/reservations"
            class="btn btn-warning"
          >
            Gestionar reservas
          </a>

        </div>

      </div>

    </div>

  </div>

</div>
