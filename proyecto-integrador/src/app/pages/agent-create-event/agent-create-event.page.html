<div class="container py-5">

  <div class="mb-4">

    <h1 class="fw-bold">
      Registrar evento
    </h1>

    <p class="text-muted">
      Completa todos los datos del evento o espectáculo.
    </p>

  </div>

  <div class="card shadow-sm border-0">

    <div class="card-body p-4">

      <form>

        <div class="row g-3">

          
          <div class="col-md-6">

            <label for="codigo" class="form-label">
              Código único del evento
            </label>

            <input
              type="text"
              id="codigo"
              class="form-control"
              placeholder="Ej: EVT-001"
            >

          </div>

         
          <div class="col-md-6">

            <label for="nombre" class="form-label">
              Nombre del evento
            </label>

            <input
              type="text"
              id="nombre"
              class="form-control"
              placeholder="Nombre del evento"
            >

          </div>

          
          <div class="col-12">

            <label for="descripcion" class="form-label">
              Descripción
            </label>

            <textarea
              id="descripcion"
              class="form-control"
              rows="4"
              placeholder="Descripción del evento"
            ></textarea>

          </div>

         
          <div class="col-md-6">

            <label for="teatro" class="form-label">
              Teatro
            </label>

            <input
              type="text"
              id="teatro"
              class="form-control"
              placeholder="Nombre del teatro"
            >

          </div>

         
          <div class="col-md-6">

            <label for="ciudad" class="form-label">
              Ciudad de realización
            </label>

            <input
              type="text"
              id="ciudad"
              class="form-control"
              placeholder="Ciudad"
            >

          </div>

         
          <div class="col-md-6">

            <label for="fechaInicio" class="form-label">
              Fecha y hora de inicio
            </label>

            <input
              type="datetime-local"
              id="fechaInicio"
              class="form-control"
            >

          </div>

          
          <div class="col-md-6">

            <label for="fechaFin" class="form-label">
              Fecha y hora estimada de finalización
            </label>

            <input
              type="datetime-local"
              id="fechaFin"
              class="form-control"
            >

          </div>

          
          <div class="col-md-6">

            <label for="capacidad" class="form-label">
              Capacidad total de espectadores
            </label>

            <input
              type="number"
              id="capacidad"
              class="form-control"
              min="1"
              placeholder="Ej: 500"
            >

          </div>

         
          <div class="col-md-6">

            <label for="precioBase" class="form-label">
              Precio base de la entrada
            </label>

            <div class="input-group">

              <span class="input-group-text">
                $
              </span>

              <input
                type="number"
                id="precioBase"
                class="form-control"
                min="0"
                placeholder="Ej: 50000"
              >

            </div>

          </div>

        
          <div class="col-12">

            <label for="observaciones" class="form-label">
              Observaciones
            </label>

            <textarea
              id="observaciones"
              class="form-control"
              rows="4"
              placeholder="Observaciones del evento"
            ></textarea>

          </div>

          <!-- Estado -->
          <div class="col-md-6">

            <label for="estado" class="form-label">
              Estado del evento
            </label>

            <select
              id="estado"
              class="form-select"
              required
            >

              <option value="" selected disabled>
                Seleccione el estado
              </option>

              <option value="PROGRAMADO">
                Programado
              </option>

              <option value="EN_BOLETERIA">
                En Boletería
              </option>

              <option value="EN_VIVO">
                En Vivo
              </option>

              <option value="FINALIZADO">
                Finalizado
              </option>

              <option value="CANCELADO">
                Cancelado
              </option>

            </select>

          </div>

        </div>

        <hr class="my-4">

        <div class="d-flex justify-content-end gap-2">

          <a
            routerLink="/agent/events"
            class="btn btn-secondary"
          >
            Cancelar
          </a>

          <button
            type="submit"
            class="btn btn-success"
          >
            <i class="bi bi-check-circle me-2"></i>
            Registrar evento
          </button>

        </div>

      </form>

    </div>

  </div>

</div>
